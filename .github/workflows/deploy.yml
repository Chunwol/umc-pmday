name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Run unit tests
        run: go test -v ./...
      - name: Build static Linux binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -tags timetzdata -trimpath -ldflags="-s -w" -o umc-pmday ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: umc-pmday-bin
          path: umc-pmday
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: [self-hosted, umc-qnap]
    concurrency:
      group: umc-pmday-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: umc-pmday-bin
      - name: Deploy and verify
        run: /deploy/deploy.sh umc-pmday "$GITHUB_SHA"
